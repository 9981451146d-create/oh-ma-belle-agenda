<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#522d63">
  <meta name="facebook-domain-verification" content="v8hqwmgv880lox4raxlxnfjjf2fx7w">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Beloved Body">
  <title>Beloved Body | Agenda</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/beloved-body-icon-192.png">
  <link rel="apple-touch-icon" href="assets/beloved-body-icon-192.png">
  <link rel="stylesheet" href="style.css?v=20260918-catalogo-33">
</head>
<body>
  <div id="introAplicacion" class="app-intro" hidden aria-hidden="true">
    <img src="assets/logo-beloved-body.png" alt="Beloved Body Salón Spa">
  </div>

  <section class="login" id="pantallaLogin">
    <div class="login-card">
      <img class="login-logo" src="assets/logo-beloved-body.png" alt="Beloved Body Salón Spa">
      <img class="avatar-img" src="assets/user-icon-transparent.png" alt="">

      <label for="usuario">Usuario</label>
      <select id="usuario" onchange="usuarioSeleccionado()">
        <option value="">Selecciona un usuario</option>
      </select>

      <div id="campoClave" class="campo-clave">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key === 'Enter') iniciarSesion()">
      </div>

      <button type="button" onclick="iniciarSesion()">Entrar</button>
      <div class="login-options">
        <label><input id="recordarme" type="checkbox"> Recordarme</label>
        <span>Beloved Body</span>
      </div>
      <p class="error" id="mensaje"></p>
    </div>
  </section>

  <section id="sistema" class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/logo-beloved-body.png" alt="Beloved Body">
        <div>
          <strong>Beloved Body</strong>
          <span id="rolActual">Agenda</span>
        </div>
      </div>

      <nav aria-label="Menu principal">
        <button class="nav-activo" type="button" data-seccion="inicio" onclick="mostrarInicio()"><img class="menu-icon" src="assets/icons/inicio.png" alt="">Inicio</button>
        <button type="button" data-seccion="estadisticas" onclick="mostrarEstadisticas()"><img class="menu-icon" src="assets/icons/estadisticas.png" alt="">Estadísticas</button>
        <button type="button" data-seccion="servicios" onclick="mostrarServicios()"><img class="menu-icon" src="assets/icons/servicios.png" alt="">Servicios</button>
        <button type="button" data-seccion="clientas" onclick="mostrarClientas()"><img class="menu-icon" src="assets/icons/personal.png" alt="">Clientas</button>
        <button type="button" data-seccion="mensajes" onclick="mostrarMensajesWhatsApp()"><img class="menu-icon" src="assets/icons/personal.png" alt="">Mensajes</button>
        <button type="button" data-seccion="configuracion" onclick="mostrarConfiguracion()"><img class="menu-icon" src="assets/icons/configuracion.png" alt="">Configuración</button>
        <button class="salir" type="button" onclick="cerrarSesion()"><img class="menu-icon" src="assets/icons/cerrar-sesion.png" alt="">Salir</button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p>belovedbody.local/agenda</p>
          <span class="premium">Agenda</span>
        </div>
        <button id="botonInstalar" class="install-app-button" type="button" onclick="instalarAplicacion()" title="Instalar aplicación" aria-label="Instalar aplicación" hidden>Instalar</button>
        <button type="button" onclick="mostrarServicios('personal')" title="Personal"><img src="assets/icons/personal.png" alt=""></button>
        <button type="button" onclick="mostrarConfiguracion()" title="Configuración"><img src="assets/icons/configuracion.png" alt=""></button>
        <button type="button" onclick="cerrarSesion()" title="Salir"><img src="assets/icons/cerrar-sesion.png" alt=""></button>
      </header>

      <section id="contenido" class="content"></section>
    </main>
  </section>

  <div id="mensajeGuardado" class="modal" role="status" aria-live="polite">
    <div class="modal-box">
      <h2 id="tituloMensaje">Listo</h2>
      <p id="textoMensaje"></p>
    </div>
  </div>

  <div id="modalFormulario" class="modal">
    <div class="modal-form">
      <button class="modal-close" type="button" onclick="cerrarModalFormulario()">×</button>
      <div id="modalContenido"></div>
    </div>
  </div>

  <script src="script.js?v=20260918-catalogo-33"></script>
</body>
</html>
