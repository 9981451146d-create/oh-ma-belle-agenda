<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#522d63">
  <title>Confirmar cita | Oh, ma belle</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 22px; font-family: Arial, sans-serif; color: #292238; background: linear-gradient(145deg, #401d59, #a83268 52%, #d7a247); }
    main { width: min(100%, 430px); padding: 32px 26px; text-align: center; background: rgba(255,255,255,.96); border-radius: 8px; box-shadow: 0 22px 55px rgba(31,18,46,.28); }
    img { width: min(250px, 80%); max-height: 105px; object-fit: contain; }
    h1 { margin: 20px 0 8px; font-size: 28px; }
    p { color: #655c70; line-height: 1.5; }
    button { width: 100%; min-height: 52px; margin-top: 14px; border: 0; border-radius: 7px; color: white; background: #653874; font-size: 17px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .ok { color: #166534; }
    .error { color: #b4233c; }
  </style>
</head>
<body>
  <main>
    <img src="assets/logo-oh-ma-belle-transparent.png" alt="Oh, ma belle Belleza y Spa">
    <h1>Confirma tu cita</h1>
    <p id="mensaje">Toca el botón para avisarnos que asistirás.</p>
    <button id="confirmar" type="button">Confirmar mi cita</button>
  </main>
  <script>
    const SUPABASE_URL = "https://vgmyzhmbuteixvlvwxjc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5b7OS0T91SbgnCog14YXEw_tr7lD3WT";
    const token = new URLSearchParams(location.search).get("token");
    const boton = document.getElementById("confirmar");
    const mensaje = document.getElementById("mensaje");
    if (!token) {
      boton.hidden = true;
      mensaje.className = "error";
      mensaje.textContent = "Este enlace de confirmación no es válido.";
    }
    boton.addEventListener("click", async () => {
      boton.disabled = true;
      boton.textContent = "Confirmando...";
      try {
        const respuesta = await fetch(`${SUPABASE_URL}/rest/v1/rpc/confirmar_cita`, {
          method: "POST",
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
          body: JSON.stringify({ p_token: token })
        });
        const textoRespuesta = await respuesta.text();
        if (!respuesta.ok) {
          let detalle = "";
          try { detalle = JSON.parse(textoRespuesta)?.message || ""; } catch {}
          if (respuesta.status === 404 || /confirmar_cita|schema cache/i.test(detalle)) {
            throw new Error("CONFIGURACION");
          }
          throw new Error("SERVIDOR");
        }
        const resultado = JSON.parse(textoRespuesta || "false");
        if (!resultado) throw new Error("ENLACE");
        mensaje.className = "ok";
        mensaje.textContent = "Tu cita quedó confirmada. ¡Te esperamos!";
        boton.hidden = true;
      } catch (error) {
        mensaje.className = "error";
        mensaje.textContent = error.message === "CONFIGURACION"
          ? "Las confirmaciones todavía no están activadas en el sistema. Comunícate con el negocio."
          : error.message === "ENLACE"
            ? "Este enlace ya no corresponde a una cita. Pide al negocio uno nuevo."
            : "No pudimos conectar con el sistema. Revisa tu internet e inténtalo nuevamente.";
        boton.disabled = false;
        boton.textContent = "Intentar nuevamente";
      }
    });
  </script>
</body>
</html>
